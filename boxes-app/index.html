<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Boxes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #eee; font: 14px -apple-system, sans-serif; user-select: none; }
    #toolbar { position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #2b2b2b; border-bottom: 1px solid #444; }
    #reset { font-size: 15px; padding: 8px 20px; border-radius: 6px; border: none; background: #d9534f; color: white; cursor: pointer; }
    #status { font-size: 15px; }
    .box { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #4a6fa5; color: white; font-weight: 600; font-size: 16px; }
    .box.hit { background: #3cb371; }
    .marker { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; pointer-events: none; }
    .marker.hit { background: #fff; }
    .marker.miss { background: #ff3b30; box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.35); }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="reset">Reset</button>
    <span id="status"></span>
  </div>
  <script src="dist/renderer.js"></script>
</body>
</html>
